spring.application.name=backend
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres/DevPersona  
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto= validate

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=true
spring.flyway.locations=classpath:db/migration

spring.ai.openai.api-key=sk-proj-21-
spring.ai.apenai.chat.model = gpt-4o-mini
spring.ai.openai.embadding.model = text-embedding-3-small
